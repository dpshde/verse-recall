language = "C"
include_guard = "RECALL_H"
pragma_once = true
cpp_compat = true
autogen_warning = "/* Generated by cbindgen. Prefer crates/recall-ffi/include/recall.h */"
include_version = true
documentation = true
documentation_style = "c99"
style = "both"
tab_width = 4
line_length = 100
usize_is_size_t = true

[export]
include = [
    "recall_err",
    "recall_opts",
    "recall_query_segment",
    "recall_engine",
    "recall_abi_version",
    "recall_open",
    "recall_open_v2",
    "recall_search_json",
    "recall_search_json_v2",
    "recall_search_with_embedding_json",
    "recall_search_with_embedding_json_v2",
    "recall_plan_query_segments_json",
    "recall_search_with_segment_embeddings_json_v2",
    "recall_engine_info_json",
    "recall_last_error_message",
    "recall_clear_last_error",
    "recall_free_str",
    "recall_close",
]

[parse]
parse_deps = false
clean = true

[fn]
prefix = ""
sort_by = "Name"

[struct]
rename_fields = "None"
