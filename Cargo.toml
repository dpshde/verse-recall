[workspace]
resolver = "2"
members = [
    "crates/recall-core",
    "crates/recall-pack",
    "crates/recall-packer",
    "crates/recall-ffi",
    "crates/recall-wasm",
    "crates/recall-cli",
    "crates/recall-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dpshde/verse-recall"
authors = ["selah-tools"]
rust-version = "1.75"

[workspace.dependencies]
recall-core = { path = "crates/recall-core" }
recall-pack = { path = "crates/recall-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
